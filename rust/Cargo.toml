[package]
name = "redh"
version = "0.1.0"
edition = "2024"
description = "Manage rootless Podman Quadlet apps that live under /opt/podman/<app>"
license-file = "../LICENSE"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
